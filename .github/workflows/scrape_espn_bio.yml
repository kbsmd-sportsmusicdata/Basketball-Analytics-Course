name: Scrape ESPN Athlete Bio Data

on:
  workflow_dispatch:
    inputs:
      input_json:
        description: "Input JSON filename (relative to repo root)"
        required: false
        default: "dashboard_slim_k6_enriched.json"
      output_json:
        description: "Output JSON filename (relative to repo root)"
        required: false
        default: "espn_bio.json"

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run ESPN bio scraper
        env:
          INPUT_JSON: ${{ github.event.inputs.input_json }}
          OUTPUT_JSON: ${{ github.event.inputs.output_json }}
        run: |
          # Override config via env vars by patching the script inline
          python3 - <<'PYEOF'
          import json, time, urllib.request, urllib.error, os

          SLEEP_MS      = 120
          RETRY_WAIT_S  = 8
          MAX_RETRIES   = 2
          INPUT_JSON    = os.environ.get("INPUT_JSON", "dashboard_slim_k6_enriched.json")
          OUTPUT_JSON   = os.environ.get("OUTPUT_JSON", "espn_bio.json")
          ESPN_TEMPLATE = (
              "https://sports.core.api.espn.com/v2/sports/basketball/"
              "college-womens/athletes/{aid}?lang=en&region=us"
          )

          with open(INPUT_JSON) as f:
              slim = json.load(f)

          players = [p for p in slim["p"] if p.get("id")]
          print(f"Players to fetch: {len(players)}")

          def fetch_bio(aid):
              url = ESPN_TEMPLATE.format(aid=aid)
              req = urllib.request.Request(url, headers={
                  "User-Agent": "Mozilla/5.0 (Macintosh; Intel Mac OS X 10_15_7)",
                  "Accept": "application/json"
              })
              with urllib.request.urlopen(req, timeout=12) as r:
                  return json.loads(r.read())

          def parse_bio(data):
              out = {}
              if "displayHeight" in data:
                  out["ht"] = data["displayHeight"]
              if "displayWeight" in data:
                  out["wt"] = data["displayWeight"]
              exp = data.get("experience", {})
              if exp:
                  out["yr"]      = exp.get("abbreviation", "")
                  out["yr_full"] = exp.get("displayValue", "")
              if "jersey" in data:
                  out["espn_jersey"] = str(data["jersey"])
              return out

          results = {}
          errors  = {}

          for i, p in enumerate(players):
              aid  = p["id"]
              name = p["n"]

              for attempt in range(MAX_RETRIES + 1):
                  try:
                      data = fetch_bio(aid)
                      bio  = parse_bio(data)
                      results[str(aid)] = bio
                      print(f"  [{i+1}/{len(players)}] {name}: {bio}")
                      break
                  except urllib.error.HTTPError as e:
                      if e.code in (429, 500, 502, 503) and attempt < MAX_RETRIES:
                          print(f"  [{i+1}] {name}: HTTP {e.code} — retrying in {RETRY_WAIT_S}s")
                          time.sleep(RETRY_WAIT_S)
                      else:
                          print(f"  [{i+1}] {name}: HTTP {e.code} — skipping")
                          errors[str(aid)] = str(e)
                          break
                  except Exception as e:
                      print(f"  [{i+1}] {name}: ERROR {e}")
                      errors[str(aid)] = str(e)
                      break

              time.sleep(SLEEP_MS / 1000)

          output = {"bio": results, "errors": errors}
          with open(OUTPUT_JSON, "w") as f:
              json.dump(output, f, indent=2)

          print(f"\nDone. Fetched {len(results)}/{len(players)} players.")
          print(f"Errors: {len(errors)}")
          print(f"Output: {OUTPUT_JSON}")
          PYEOF

      - name: Upload output JSON as artifact
        uses: actions/upload-artifact@v4
        with:
          name: espn-bio-output
          path: ${{ github.event.inputs.output_json || 'espn_bio.json' }}
          retention-days: 30

      - name: Commit output JSON back to branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          OUTPUT_FILE="${{ github.event.inputs.output_json || 'espn_bio.json' }}"
          git add "$OUTPUT_FILE"
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: update $OUTPUT_FILE from ESPN API scrape [skip ci]"
            git push
          fi
